<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740"><rect width="1100" height="740" fill="#f7f9f7"/><g font-family="Arial, sans-serif"><text x="30" y="45" font-size="26" font-weight="bold" fill="#142e35">Конференции.РФ — схема базы данных</text><text x="30" y="72" font-size="13" fill="#66767b">PK — первичный ключ · FK — внешний ключ · UK — уникальное значение</text><rect x="30" y="100" width="270" height="258" rx="12" fill="white" stroke="#ccd9cf"/><path d="M42 100H288Q300 100 300 112V143H30V112Q30 100 42 100" fill="#00695e"/><text x="46" y="128" font-size="18" font-weight="bold" fill="white">users</text><text x="45" y="167" font-size="12" fill="#142e35">PK  id · INT</text><text x="45" y="192" font-size="12" fill="#142e35">UK  login · VARCHAR(50)</text><text x="45" y="217" font-size="12" fill="#142e35">password_hash · VARCHAR(255)</text><text x="45" y="242" font-size="12" fill="#142e35">full_name · VARCHAR(150)</text><text x="45" y="267" font-size="12" fill="#142e35">phone · VARCHAR(15)</text><text x="45" y="292" font-size="12" fill="#142e35">email · VARCHAR(190)</text><text x="45" y="317" font-size="12" fill="#142e35">role · user / admin</text><text x="45" y="342" font-size="12" fill="#142e35">created_at · TIMESTAMP</text><rect x="390" y="100" width="285" height="233" rx="12" fill="white" stroke="#ccd9cf"/><path d="M402 100H663Q675 100 675 112V143H390V112Q390 100 402 100" fill="#00695e"/><text x="406" y="128" font-size="18" font-weight="bold" fill="white">bookings</text><text x="405" y="167" font-size="12" fill="#142e35">PK  id · INT</text><text x="405" y="192" font-size="12" fill="#142e35">FK  user_id → users.id</text><text x="405" y="217" font-size="12" fill="#142e35">FK  room_id → rooms.id</text><text x="405" y="242" font-size="12" fill="#142e35">starts_at · DATETIME</text><text x="405" y="267" font-size="12" fill="#142e35">payment · cash / sbp</text><text x="405" y="292" font-size="12" fill="#142e35">status · new / scheduled / completed</text><text x="405" y="317" font-size="12" fill="#142e35">created_at · TIMESTAMP</text><rect x="30" y="430" width="270" height="183" rx="12" fill="white" stroke="#ccd9cf"/><path d="M42 430H288Q300 430 300 442V473H30V442Q30 430 42 430" fill="#00695e"/><text x="46" y="458" font-size="18" font-weight="bold" fill="white">rooms</text><text x="45" y="497" font-size="12" fill="#142e35">PK  id · INT</text><text x="45" y="522" font-size="12" fill="#142e35">name · VARCHAR(100)</text><text x="45" y="547" font-size="12" fill="#142e35">type · VARCHAR(30)</text><text x="45" y="572" font-size="12" fill="#142e35">capacity · SMALLINT</text><text x="45" y="597" font-size="12" fill="#142e35">description · VARCHAR(500)</text><rect x="770" y="100" width="300" height="183" rx="12" fill="white" stroke="#ccd9cf"/><path d="M782 100H1058Q1070 100 1070 112V143H770V112Q770 100 782 100" fill="#00695e"/><text x="786" y="128" font-size="18" font-weight="bold" fill="white">reviews</text><text x="785" y="167" font-size="12" fill="#142e35">PK  id · INT</text><text x="785" y="192" font-size="12" fill="#142e35">FK / UK  booking_id → bookings.id</text><text x="785" y="217" font-size="12" fill="#142e35">rating · 1…5</text><text x="785" y="242" font-size="12" fill="#142e35">body · TEXT</text><text x="785" y="267" font-size="12" fill="#142e35">created_at · TIMESTAMP</text><rect x="770" y="430" width="300" height="133" rx="12" fill="white" stroke="#ccd9cf"/><path d="M782 430H1058Q1070 430 1070 442V473H770V442Q770 430 782 430" fill="#00695e"/><text x="786" y="458" font-size="18" font-weight="bold" fill="white">login_attempts</text><text x="785" y="497" font-size="12" fill="#142e35">PK  id · INT</text><text x="785" y="522" font-size="12" fill="#142e35">attempt_key · CHAR(64)</text><text x="785" y="547" font-size="12" fill="#142e35">attempted_at · BIGINT</text><g stroke="#00695e" stroke-width="2" fill="none"><path d="M300 172H390M300 520H340V197H390M675 172H770"/></g><g font-size="12" fill="#00695e"><text x="310" y="161">1</text><text x="362" y="161">0…N</text><text x="310" y="509">1</text><text x="352" y="222">0…N</text><text x="686" y="161">1</text><text x="734" y="161">0…1</text></g><text x="30" y="688" font-size="13" fill="#66767b">Одна заявка относится к одному пользователю и одному помещению. На заявку — не более одного отзыва.</text><text x="30" y="711" font-size="13" fill="#66767b">login_attempts — служебная таблица ограничения попыток входа; внешних ключей нет.</text></g></svg>